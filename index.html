<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CondoHub</title><style>
:root{--bg:#090b13;--panel:#141a2a;--line:#293149;--muted:#a4aec4;--purple:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#25154b,transparent 35%),var(--bg);color:#fff;font:15px system-ui}header{border-bottom:1px solid var(--line);background:#090b13dd}nav,.wrap{max-width:1100px;margin:auto;padding:18px 22px}nav{display:flex;justify-content:space-between}.logo{font-size:22px;font-weight:900}.logo span{color:var(--cyan)}.btn{border:0;border-radius:10px;padding:11px 16px;background:linear-gradient(100deg,var(--purple),#536ff5);color:white;font-weight:700;cursor:pointer}.ghost{background:#20283b;border:1px solid var(--line)}.hero{padding:60px 0 30px}.eyebrow{color:var(--cyan);letter-spacing:2px;font-size:12px;font-weight:800}h1{font-size:clamp(38px,6vw,62px);line-height:1.05;margin:12px 0}.muted{color:var(--muted)}.stats{display:flex;gap:12px;margin:25px 0;flex-wrap:wrap}.stat{background:var(--panel);padding:14px 20px;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:22px}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.field{background:#111827;color:white;border:1px solid var(--line);border-radius:10px;padding:12px}.toolbar input{flex:1;min-width:190px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#191f32,#111624);overflow:hidden}.cover{height:115px;background:linear-gradient(120deg,#362064,#086c7d);padding:15px;font-size:30px}.body{padding:17px}.tag{font-size:11px;color:#c4b5fd;background:#30264c;padding:5px 9px;border-radius:20px}.body p{color:var(--muted);line-height:1.5;min-height:42px}.meta{color:var(--muted);font-size:12px;margin:15px 0}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;padding:15px}.modal.open{display:grid}.dialog{width:min(480px,100%);background:#151c2c;border:1px solid var(--line);border-radius:16px;padding:22px;max-height:90vh;overflow:auto}.dialog input,.dialog select,.dialog textarea{width:100%;margin:6px 0 12px}.dialog label{font-size:13px;color:var(--muted)}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}footer{text-align:center;color:var(--muted);padding:28px;border-top:1px solid var(--line);margin-top:50px}
</style></head><body><header><nav><div class="logo">CONDO<span>HUB</span></div><button class="btn ghost" onclick="showAdmin()">Admin</button></nav></header><main class="wrap"><div class="hero"><div class="eyebrow">COMMUNITY SERVER DIRECTORY</div><h1>Find your next<br><span style="color:#a78bfa">gaming world.</span></h1><p class="muted">Temukan server komunitas, jelajahi pengalaman bermain baru, dan bagikan server favoritmu.</p><div class="stats"><div class="stat"><b id="count">0</b><span class="muted">Server terdaftar</span></div><div class="stat"><b>24/7</b><span class="muted">Community hub</span></div></div></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>Featured servers</h2><button class="btn" onclick="showAdd()">+ Tambah server</button></div><div class="toolbar"><input id="search" class="field" placeholder="Cari server..." oninput="render()"><select id="cat" class="field" onchange="render()"><option value="">Semua kategori</option><option>Roleplay</option><option>Survival</option><option>Adventure</option><option>Minigames</option></select></div><div class="grid" id="cards"></div></main><footer>© 2026 CondoHub</footer>
<div class="modal" id="adminModal"><div class="dialog"><div style="display:flex;justify-content:space-between"><h2>Admin panel</h2><button class="btn ghost" onclick="hide('adminModal')">✕</button></div><div id="loginBox"><label>Username</label><input class="field" id="username" value="admin"><label>Password</label><input class="field" id="password" type="password"><button class="btn" onclick="login()">Masuk</button></div><div id="adminBox" hidden><button class="btn ghost" onclick="logout()">Logout</button><div id="adminList"></div></div></div></div>
<div class="modal" id="addModal"><div class="dialog"><div style="display:flex;justify-content:space-between"><h2>Tambah server</h2><button class="btn ghost" onclick="hide('addModal')">✕</button></div><form id="form"><label>Nama server</label><input class="field" name="name" required maxlength="60"><label>Kategori</label><select class="field" name="category"><option>Roleplay</option><option>Survival</option><option>Adventure</option><option>Minigames</option></select><label>Deskripsi</label><textarea class="field" name="description" required maxlength="180"></textarea><label>URL server / komunitas</label><input class="field" name="url" type="url" required placeholder="https://..."><button class="btn">Simpan</button></form></div></div>
<script>
let servers=[];const $=id=>document.getElementById(id);function hide(id){$(id).classList.remove("open")}function showAdmin(){$("adminModal").classList.add("open")}function showAdd(){$("addModal").classList.add("open")}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(url,opts={}){let r=await fetch("/api"+url,{...opts,headers:{"Content-Type":"application/json",...(opts.headers||{})}});let data=await r.json();if(!r.ok)throw Error(data.error||"Request gagal");return data}
async function load(){try{servers=await api("/servers");render()}catch(e){$("cards").textContent=e.message}}
function render(){let q=$("search").value.toLowerCase(),c=$("cat").value;let list=servers.filter(s=>(!c||s.category===c)&&(`${s.name} ${s.description}`.toLowerCase().includes(q)));$("count").textContent=servers.length;$("cards").innerHTML=list.map(s=>`<article class="card"><div class="cover">🎮 <span style="float:right;font-size:13px">${esc(s.category)}</span></div><div class="body"><span class="tag">${esc(s.category)}</span><h3>${esc(s.name)}</h3><p>${esc(s.description)}</p><div class="meta">● Community server</div><a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Kunjungi ↗</a></div></article>`).join("")||"<p class='muted'>Belum ada server yang cocok.</p>"}
async function login(){try{await api("/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});$("loginBox").hidden=true;$("adminBox").hidden=false;adminRender()}catch(e){alert(e.message)}}
async function logout(){await api("/logout",{method:"POST"});$("loginBox").hidden=false;$("adminBox").hidden=true}
function adminRender(){$("adminList").innerHTML=servers.map(s=>`<div class="row"><span>${esc(s.name)}</span><button class="btn ghost" onclick="del(${s.id})">Hapus</button></div>`).join("")}
async function del(id){try{await api("/servers/"+id,{method:"DELETE"});await load();adminRender()}catch(e){alert(e.message)}}
$("form").addEventListener("submit",async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{await api("/servers",{method:"POST",body:JSON.stringify(data)});await load();e.target.reset();hide("addModal")}catch(err){alert(err.message)}});load();
</script></body></html>
